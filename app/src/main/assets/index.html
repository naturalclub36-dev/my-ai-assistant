<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>My AI Assistant</title><style>body{margin:0;background:#10131a;color:#fff;font-family:Arial;text-align:center}main{padding:38px 22px}.orb{width:90px;height:90px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#6c5ce7,#00cec9);display:grid;place-items:center;font-size:28px;font-weight:bold}button{display:block;width:100%;padding:17px;margin:14px 0;border:0;border-radius:14px;font-size:16px}.go{background:#6c5ce7;color:white}.box{background:#1a1f29;border:1px solid #303744;padding:18px;border-radius:16px;margin-top:18px}</style></head><body><main><div class="orb">AI</div><h1>My AI Assistant</h1><p id="status">Ready</p><button class="go" onclick="access()">⚙️ Enable phone control</button><button onclick="voice()">🎙️ Speak a command</button><div class="box"><b>Try:</b><p>“Open WhatsApp”</p><p>“Open YouTube”</p><p>“Open Chrome”</p></div></main><script>function access(){Android.openAccessibility();}function voice(){document.getElementById('status').innerText='Use the microphone button to give a command.';}</script></body></html>
